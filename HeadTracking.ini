; RoadCraft Head Tracking - configuration
; Edit values, restart the game to apply.
;
; Controls (remappable, see [Hotkeys]):
;   End  / Ctrl+Shift+Y   toggle tracking
;   PgUp / Ctrl+Shift+G   cycle tracking mode (rotation and position
;                         / rotation only / position only)
;
; Centre, sensitivity, curves and axis inversion belong in your tracker
; (OpenTrack, the phone app), so one profile works the same in every game.

[Network]
UdpPort=4242

[General]
EnableOnStartup=1

[Hotkeys]
; Windows virtual key codes, in hex. Each action has a nav-cluster key and a
; Ctrl+Shift+<key> chord, and both fire it.
; Common codes: End 0x23, Insert 0x2D, Delete 0x2E, PgUp 0x21,
; PgDn 0x22, F1-F12 0x70-0x7B, A-Z 0x41-0x5A.
ToggleKey=0x23
CycleModeKey=0x21
ChordToggleKey=0x59
ChordCycleModeKey=0x47

[Smoothing]
; 0.0 none .. 1.0 heavy. Covers rotation and position. LocalSmoothing applies
; to a tracker sending to 127.0.0.1; RemoteSmoothing to anything arriving over
; the network, including this PC's own LAN address.
LocalSmoothing=0.0
RemoteSmoothing=0.15

[Position]
Enabled=1
; How far the head may move the camera, in metres, 0 to 0.5. LimitZ is leaning
; forward and LimitZBack is leaning away; LimitY is up and LimitYDown is down.
LimitX=0.30
LimitY=0.20
LimitYDown=0.20
LimitZ=0.40
LimitZBack=0.10
