[workspace]
name = "roadcraft-headtracking"
version = "0.1.0"
description = "Head tracking mod for RoadCraft"
license = "MIT"
license-file = "LICENSE"
channels = ["conda-forge"]
platforms = ["win-64"]

[tasks]
update-submodule = "git submodule update --remote cameraunlock-core && powershell -NoProfile -ExecutionPolicy Bypass -File cameraunlock-core/scripts/update-submodule.ps1"
sync = "git submodule update --remote cameraunlock-core"

# No -G: let CMake auto-detect the installed Visual Studio generator. Pinning
# a version breaks whenever a runner image moves to a newer VS.
# Guarded on the CACHE, not the directory. `cmake -B build` creates the
# directory before it can fail, so a configure that died (a missing submodule, a
# broken toolchain) left a build/ with no project in it - and every later
# `pixi run build` then skipped configure and failed with "could not load cache",
# with nothing pointing at `pixi run clean` as the fix.
setup = { cmd = """
    powershell -Command "if (-not (Test-Path 'build/CMakeCache.txt')) { cmake -B build -A x64 } else { Write-Host 'Build already configured, skipping setup' -ForegroundColor Yellow }"
""" }

build = { cmd = "cmake --build build --config Release", depends-on = ["setup"] }
build-debug = { cmd = "cmake --build build --config Debug", depends-on = ["setup"] }

# No $variables in inline commands: pixi's task shell expands them to empty
# strings before PowerShell ever sees the line. A missing directory is already
# clean, which is the only error -ErrorAction Ignore drops here.
clean = { cmd = """
    powershell -NoProfile -Command "Get-Item build -ErrorAction Ignore | Remove-Item -Recurse -Force; Write-Host 'Build artifacts cleaned' -ForegroundColor Green"
""" }

clean-all = { cmd = """
    powershell -NoProfile -Command "Get-Item build,build-tests,release -ErrorAction Ignore | Remove-Item -Recurse -Force; Write-Host 'All build artifacts cleaned' -ForegroundColor Green"
""" }

# Unit tests: the HeadTracking.ini boundary, the shipped defaults, the camera
# transform composition and the gameplay gate. Builds in
# build-tests/ so the packaged build/ tree never contains a test binary.
test = { cmd = "powershell -ExecutionPolicy Bypass -File scripts/run-tests.ps1" }

# Bump the vendored Ultimate ASI Loader copy. Manual; commit the result.
update-deps = { cmd = "powershell -ExecutionPolicy Bypass -File scripts/update-deps.ps1" }

# Installer ZIP only. There is no -nexus.zip: the payload has to sit beside the
# exe in root\bin\pc, where no mod manager deploys, so a Nexus archive would
# install and never load. scripts/package-release.ps1 carries the full reason.
# `test` as well as `build`: the commit a release is cut from is named
# "Release vX.Y.Z", which build.yml skips on purpose, and the tag workflow's
# only build step is this task. Without the dependency the exact tree that
# becomes the published .asi is the one tree CI never runs the suite against.
package = { cmd = "powershell -ExecutionPolicy Bypass -File scripts/package-release.ps1", depends-on = ["test", "build"] }

# Both take no arguments: they check this repo's newest release ZIP against
# launcher-manifest.json, and THIRD-PARTY-NOTICES.md against what ships.
# `package` already runs the manifest check as a gate.
validate-manifest = "node cameraunlock-core/scripts/validate-manifest.mjs"
validate-notices = "node cameraunlock-core/scripts/validate-notices.mjs"

# Dev loop: build, then copy the .asi + vendored loader straight into the
# detected game folder. install.cmd is the end-user path and is not run here -
# it pauses when it isn't given /y, and pixi allocates no stdin to read from.
install = { cmd = "powershell -ExecutionPolicy Bypass -File scripts/deploy.ps1", depends-on = ["build"] }

# Not the inverse of `install`: that deploys to every detected copy and writes
# no state file, while uninstall.cmd resolves one copy and leaves the loader
# alone unless the state file says the installer put it there. After a dev
# install the .asi and the logs go and dinput8.dll stays. Delete it by hand.
uninstall = "scripts/uninstall.cmd /y"

# Fully unattended: `pixi run release <major|minor|patch|nightly|X.Y.Z>` is the
# whole authorization. Preconditions fail fast; nothing prompts. `nightly`
# dispatches to scripts/release-nightly.ps1 from inside release.ps1, so the
# task surface stays one entry.
release = "powershell -ExecutionPolicy Bypass -File scripts/release.ps1"

# Compare the installed Roadcraft - Retail.exe PE fingerprint against every build
# profile in src/builds/. First thing to run when a user reports the dormant
# "unknown build" log line.
check-fingerprint = "powershell -ExecutionPolicy Bypass -File scripts/check-fingerprint.ps1"

[dependencies]
# No pixi-managed deps - relies on system CMake + Visual Studio.
